<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Juice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- One 512×512 scene; the browser scales it to whatever size the window is. -->
<svg id="scene" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g-juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb04a"/>
      <stop offset="1" stop-color="#d9601a"/>
    </linearGradient>
    <linearGradient id="g-interior" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16191d"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="g-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30353c"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
    <linearGradient id="g-front" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22252a"/>
      <stop offset="1" stop-color="#17191c"/>
    </linearGradient>
    <linearGradient id="g-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f454d"/>
      <stop offset="1" stop-color="#353a41"/>
    </linearGradient>
    <radialGradient id="g-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-glass">
      <rect x="20" y="22" width="260" height="336" rx="10"/>
    </clipPath>
  </defs>

  <!--
    The case is a 3/4 view: camera turned 30° and raised 20°. Each face is
    drawn flat in its own coordinates and mapped onto the case by a matrix:
      side panel  300 × 380  (glass window, faces the viewer)
      front panel 140 × 380  (Claude logo, recedes to the right)
      top         300 × 140
  -->
  <g id="case" class="drag" transform="translate(104.2,60.1) scale(0.92)">
    <!-- Feet, drawn first so the panels cover their tops. -->
    <g transform="matrix(0.866,0.171,0,0.94,0,0)" fill="#111214">
      <rect x="22" y="376" width="44" height="14" rx="3"/>
      <rect x="234" y="376" width="44" height="14" rx="3"/>
    </g>
    <g transform="matrix(0.5,-0.296,0,0.94,259.8,51.3)" fill="#111214">
      <rect x="96" y="376" width="36" height="14" rx="3"/>
    </g>

    <!-- Top, with a mesh vent. -->
    <g transform="matrix(0.866,0.171,0.5,-0.296,0,0)">
      <rect width="300" height="140" rx="5" fill="url(#g-top)" stroke="#4f565f" stroke-width="1.5"/>
      <g stroke="#2a2e34" stroke-width="5" stroke-linecap="round">
        <line x1="50" y1="36" x2="250" y2="36"/><line x1="50" y1="53" x2="250" y2="53"/>
        <line x1="50" y1="70" x2="250" y2="70"/><line x1="50" y1="87" x2="250" y2="87"/>
        <line x1="50" y1="104" x2="250" y2="104"/>
      </g>
    </g>

    <!-- Front panel. -->
    <g transform="matrix(0.5,-0.296,0,0.94,259.8,51.3)">
      <rect width="140" height="380" rx="5" fill="url(#g-front)" stroke="#43484f" stroke-width="1.5"/>
      <g id="spark" transform="translate(70,74) scale(1.7)"></g>
      <circle id="power-ring" cx="70" cy="152" r="12" fill="none" stroke="#ff9a3c" stroke-width="3"/>
      <circle cx="70" cy="152" r="6" fill="#2b2f35" stroke="#555b63" stroke-width="1.5"/>
      <rect x="42" y="184" width="20" height="7" rx="1.5" fill="#0b0c0e"/>
      <rect x="78" y="184" width="20" height="7" rx="1.5" fill="#0b0c0e"/>
      <g stroke="#0f1012" stroke-width="5" stroke-linecap="round">
        <line x1="30" y1="232" x2="110" y2="232"/><line x1="30" y1="246" x2="110" y2="246"/>
        <line x1="30" y1="260" x2="110" y2="260"/><line x1="30" y1="274" x2="110" y2="274"/>
        <line x1="30" y1="288" x2="110" y2="288"/><line x1="30" y1="302" x2="110" y2="302"/>
        <line x1="30" y1="316" x2="110" y2="316"/><line x1="30" y1="330" x2="110" y2="330"/>
        <line x1="30" y1="344" x2="110" y2="344"/>
      </g>
    </g>

    <!-- Side panel with the glass window and everything behind it. -->
    <g id="side" transform="matrix(0.866,0.171,0,0.94,0,0)">
      <rect width="300" height="380" rx="5" fill="url(#g-side)" stroke="#4f565f" stroke-width="1.5"/>
      <rect x="14" y="16" width="272" height="348" rx="14" fill="#0d0e10"/>
      <g clip-path="url(#clip-glass)">
        <rect x="20" y="22" width="260" height="336" fill="url(#g-interior)"/>
        <g id="fan" transform="translate(84,88)">
          <circle r="46" fill="#121417" stroke="#22262b" stroke-width="3"/>
          <g id="fan-blades" fill="#1f2328"></g>
          <circle r="10" fill="#2a2e34"/>
        </g>
        <rect x="176" y="56" width="66" height="66" rx="5" fill="#14171a" stroke="#1f2328" stroke-width="2"/>
        <rect x="38" y="214" width="224" height="30" rx="4" fill="#15181b" stroke="#20242a" stroke-width="2"/>
        <rect x="20" y="314" width="260" height="44" fill="#121417"/>

        <ellipse id="glow" cx="150" cy="356" rx="170" ry="70" fill="url(#g-glow)"/>
        <path id="juice" fill="url(#g-juice)" opacity="0.92"/>
        <g id="bubbles" fill="#ffe0b0" fill-opacity="0.45"></g>
        <path id="surface" fill="none" stroke="#ffd59a" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

        <polygon points="62,22 116,22 20,180 20,112" fill="#fff" opacity="0.05"/>
        <polygon points="136,22 156,22 20,262 20,234" fill="#fff" opacity="0.04"/>
      </g>
      <rect x="20" y="22" width="260" height="336" rx="10" fill="none" stroke="#5a616b" stroke-opacity="0.5" stroke-width="1"/>
      <g fill="#444a52">
        <circle cx="8" cy="9" r="3"/><circle cx="292" cy="9" r="3"/>
        <circle cx="8" cy="371" r="3"/><circle cx="292" cy="371" r="3"/>
      </g>
    </g>

    <!-- Highlight on the corner nearest the viewer. -->
    <line x1="259.8" y1="52" x2="259.8" y2="407" stroke="#6a717b" stroke-opacity="0.6" stroke-width="1.5"/>
  </g>

  <!-- Readout under the case. -->
  <g id="readout">
    <rect id="readout-bg" x="136" y="470" width="240" height="26" rx="13" fill="#141619" fill-opacity="0.88" stroke="#2e3238"/>
    <text id="readout-text" x="256" y="487.5" text-anchor="middle">waiting for Claude Code…</text>
  </g>

  <!-- Resize grip, since the window has no frame. -->
  <g id="grip" stroke="#8a9099" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <rect x="482" y="482" width="30" height="30" fill="transparent" stroke="none"/>
    <line x1="504" y1="494" x2="494" y2="504"/>
    <line x1="504" y1="500" x2="500" y2="504"/>
  </g>
</svg>
<script src="main.js"></script>
</body>
</html>
